appId: com.flux.pipeline
productName: FLUX
copyright: "© 2025 FLUX Pipeline"

# Inclure le backend Python buildé par PyInstaller
extraResources:
  - from: backend/dist/flux_backend
    to: backend
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker   # Pas de droits admin requis
  signAndEditExecutable: false          # Désactiver pour builds sans cert (re-activer pour release finale)
  icon: scripts/icon.ico

# Installeur assisté NSIS — détecte une version antérieure et propose la MAJ,
# sinon installation neuve. Voir scripts/installer.nsh (macro customInit).
nsis:
  oneClick: false                      # Wizard d'installation (assisté)
  perMachine: false                    # Installation par utilisateur (sans admin)
  allowElevation: false                # Jamais de demande admin
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FLUX
  runAfterFinish: true
  # Nom de l'installeur généré : FLUX-Setup-<version>.exe
  # scripts/build.cjs le remplace (-c.nsis.artifactName) par la version affichee x.x.xxx.
  artifactName: ${productName}-Setup-${version}.${ext}
  # Hooks custom (message "mise à jour détectée" vs "installation neuve")
  include: scripts/installer.nsh
  # Icône de l'assistant d'installation / désinstallation
  installerIcon: scripts/icon.ico
  uninstallerIcon: scripts/icon.ico

directories:
  output: INSTALLEURS
  buildResources: scripts/


files:
  - dist/**
  - dist-electron/**
  # Runtime app icon (window, taskbar while running, splash, notifications) is read
  # at run time from scripts/icon.* by the main process. The whitelist above would
  # otherwise exclude scripts/, so the packaged build showed the default Electron
  # icon. These land in app.asar/scripts/ where main.ts already resolves them.
  - scripts/icon.ico
  - scripts/icon.png
  - "!**/{.git,.github,node_modules/__tests__}"
