flux_flow: 2
name: example_daily_render
label: "Exemple : daily render"
description: "Exemple P3 (02_NODES section 12, exemple 3, sans le Schedule de P5) : copie les captures Maya et Houdini publiees aujourd'hui dans un dossier date du jour, puis previent l'equipe. Copie sans ecrasement."
run_policy: skip_if_running
nodes:
  n2: {type: event.page_inputs, pos: [0, 160], params: {page: daily_render, ports: {outputs: {dest_folder: dir, daily_render: exec}, labels: {dest_folder: Dossier, daily_render: "Lancer maintenant"}}}}
  n4: {type: flux.find_publishes, pos: [320, 160], params: {date: today, soft: "maya houdini", type: capture}}
  n5: {type: operator.date_now, pos: [0, 480], params: {}}
  n6: {type: operator.path_join, pos: [320, 400], params: {}}
  n7: {type: action.make_dir, pos: [640, 160], params: {}}
  n8: {type: operator.foreach_begin, pos: [960, 160], params: {mode: sequential}}
  n9: {type: flux.publish_fields, pos: [1280, 320], params: {}}
  n10: {type: action.copy, pos: [1280, 160], params: {overwrite: false}}
  n11: {type: operator.foreach_end, pos: [1600, 160], params: {begin: n8}}
  n12: {type: flux.notify, pos: [1920, 160], params: {text: "Daily copie", level: info, where: both}}
links:
  - {from: n2.daily_render, to: n4.exec}
  - {from: n2.dest_folder, to: n6.base}
  - {from: n5.date, to: n6.a}
  - {from: n6.path, to: n7.path}
  - {from: n4.then, to: n7.exec}
  - {from: n7.then, to: n8.exec}
  - {from: n4.items, to: n8.list}
  - {from: n8.loop, to: n10.exec}
  - {from: n8.item, to: n9.publish}
  - {from: n9.path, to: n10.source}
  - {from: n7.dir, to: n10.dest}
  - {from: n10.then, to: n11.exec}
  - {from: n11.done, to: n12.exec}
  - {from: n7.dir, to: n12.path}
notes:
  - {id: k1, pos: [0, 640], text: "InputsPageReader : la page daily_render donne son bouton (Lancer maintenant) et son champ Dossier.
Le bouton copie les captures du jour dans <dest_folder>/<date>.\nUn re-run le meme jour echoue sur les fichiers deja copies (pas d'ecrasement).\nEssai a blanc : liste les copies, n'ecrit rien."}
