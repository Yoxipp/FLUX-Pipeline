flux_flow: 2
name: example_foreach
label: "Exemple : boucle et notification"
description: "Exemple P2 (02_NODES section 12, avec les nodes de P2) : deux departs, une boucle ForEach sur une liste, une variable, un If et un toast. Aucun effet sur le disque."
run_policy: skip_if_running
interface:
  - {id: notify, type: bool, label: "Notifier a la fin", default: true}
variables:
  - {name: last, type: str}
nodes:
  n1: {type: event.manual, pos: [0, 0], params: {}}
  n2: {type: event.button, pos: [0, 160], params: {button_id: example}}
  n3: {type: data.value, pos: [320, 160], params: {type: list, value: [shot_010, shot_020, shot_030]}}
  n4: {type: operator.foreach_begin, pos: [640, 0], params: {mode: sequential}}
  n5: {type: data.set_variable, pos: [960, 0], params: {name: last}}
  n6: {type: operator.foreach_end, pos: [1280, 0], params: {begin: n4}}
  n7: {type: logic.if, pos: [1600, 0], params: {}}
  n8: {type: data.flow_input, pos: [1280, 200], params: {id: notify}}
  n9: {type: flux.notify, pos: [1920, 0], params: {level: info, where: toast}}
  n10: {type: data.get_variable, pos: [1600, 200], params: {name: last}}
links:
  - {from: n1.then, to: n4.exec}
  - {from: n10.value, to: n9.text}
  - {from: n2.then, to: n4.exec}
  - {from: n3.value, to: n4.list}
  - {from: n4.item, to: n5.value}
  - {from: n4.item, to: n6.collect}
  - {from: n4.loop, to: n5.exec}
  - {from: n5.then, to: n6.exec}
  - {from: n6.done, to: n7.exec}
  - {from: n7.then, to: n9.exec}
  - {from: n8.value, to: n7.condition}
notes:
  - {id: k1, pos: [0, 320], text: "Run : les nodes passent en cours puis fini, un toast s'affiche.\nEssai : le toast est simule (rapport dans Runs)."}
  - {id: k2, pos: [640, 320], text: "Boucle : ForEachBegin donne chaque element (item) ; ce qui est relie entre Begin et End tourne une fois par element.\nSetVariable garde le dernier shot ; GetVariable le relit apres la boucle pour le texte du toast."}
  - {id: k3, pos: [1600, 320], text: "If : la case de l'interface notify (FlowInput) decide si le toast part."}
