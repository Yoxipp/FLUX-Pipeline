flux_flow: 2
name: nk_publish
label: nkPublish
description: "Publish Nuke (node livre, verrouille ; boite noire, decision 9) : meme code que le Publisher Nuke, vNNN immuable + LAST, activite, flows OnPublish. Live, instance du Publisher. Double clic pour voir dedans ; Deverrouiller = copie d'equipe (verifications avant publish)."
node_type: dcc.nk_publish
interface:
  inputs:
    - {id: session, type: "session[nuke]", label: "Session Nuke (Live)"}
    - {id: "name", type: "str", label: "Nom FLUX du publish", default: ""}
    - {id: "node", type: "dcc_node", label: "Node a ecrire (vide = selection)"}
    - {id: "format", type: "str", label: "Extension (.exr, .png, .mov...)", default: ".exr"}
    - {id: "frame_range", type: "str", label: "Plage (caches, anim) : 1001-1050", default: ""}
    - {id: "sequence", type: "bool", label: "Une image par frame", default: false}
    - {id: "description", type: "str", label: "Description du publish (journal)", default: ""}
    - {id: "colorspace", type: "str", label: "Espace couleur du Write (vide = defaut FLUX)", default: ""}
  outputs:
    - {id: publish, type: publish, label: "Le publish"}
    - {id: path, type: path, label: "Fichier publie"}
    - {id: version, type: int, label: "Version ecrite"}
    - {id: files, type: "list[path]", label: "Tous les fichiers publies"}
nodes:
  ev: {type: event.manual, pos: [0, 160]}
  in_session: {type: data.flow_input, pos: [0, 320], params: {id: session}}
  in_name: {type: data.flow_input, pos: [0, 440], params: {id: name}}
  in_node: {type: data.flow_input, pos: [0, 560], params: {id: node}}
  in_format: {type: data.flow_input, pos: [0, 680], params: {id: format}}
  in_frame_range: {type: data.flow_input, pos: [0, 800], params: {id: frame_range}}
  in_sequence: {type: data.flow_input, pos: [0, 920], params: {id: sequence}}
  in_description: {type: data.flow_input, pos: [0, 1040], params: {id: description}}
  in_colorspace: {type: data.flow_input, pos: [0, 1160], params: {id: colorspace}}
  core: {type: dcc.nk_publish_core, pos: [320, 160]}
  out_publish: {type: subflow.flow_output, pos: [640, 160], params: {id: publish}}
  out_path: {type: subflow.flow_output, pos: [960, 160], params: {id: path}}
  out_version: {type: subflow.flow_output, pos: [1280, 160], params: {id: version}}
  out_files: {type: subflow.flow_output, pos: [1600, 160], params: {id: files}}
links:
  - {from: ev.then, to: core.exec}
  - {from: in_session.value, to: core.session}
  - {from: in_name.value, to: core.name}
  - {from: in_node.value, to: core.node}
  - {from: in_format.value, to: core.format}
  - {from: in_frame_range.value, to: core.frame_range}
  - {from: in_sequence.value, to: core.sequence}
  - {from: in_description.value, to: core.description}
  - {from: in_colorspace.value, to: core.colorspace}
  - {from: core.then, to: out_publish.exec}
  - {from: core.publish, to: out_publish.value}
  - {from: out_publish.then, to: out_path.exec}
  - {from: core.path, to: out_path.value}
  - {from: out_path.then, to: out_version.exec}
  - {from: core.version, to: out_version.value}
  - {from: out_version.then, to: out_files.exec}
  - {from: core.files, to: out_files.value}
notes:
  - {id: k1, pos: [0, 1320], text: "Node livre avec FLUX : lecture seule. Deverrouiller (Team TD) pour ajouter des verifications avant le publish ; Revenir au defaut supprime la copie."}
