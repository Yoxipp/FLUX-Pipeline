flux_flow: 2
name: may_publish
label: mayPublish
description: "Publish Maya (node livre, verrouille ; boite noire, decision 9) : meme code que le Publisher Maya, vNNN immuable + LAST, activite, flows OnPublish. Double clic pour voir dedans ; Deverrouiller = copie d'equipe (verifications avant publish)."
node_type: dcc.may_publish
interface:
  inputs:
    - {id: session, type: "session[maya]", label: "Session Maya (Live)"}
    - {id: name, type: str, label: "Nom FLUX (tokens, sans version)", default: ""}
    - {id: format, type: str, label: "Extension", default: ".ma"}
    - {id: scope, type: select, label: "Scene ou selection", default: scene, options: [scene, selection]}
    - {id: description, type: str, label: "Description", default: ""}
    - {id: frame_range, type: str, label: "Plage", default: ""}
  outputs:
    - {id: publish, type: publish, label: "Le publish"}
    - {id: path, type: path, label: "Fichier LAST publie"}
    - {id: version, type: int, label: "Version ecrite"}
nodes:
  ev: {type: event.manual, pos: [0, 160]}
  in_session: {type: data.flow_input, pos: [0, 320], params: {id: session}}
  core: {type: dcc.may_publish_core, pos: [320, 160], params: {name: "${name}", format: "${format}", scope: "${scope}", description: "${description}", frame_range: "${frame_range}"}}
  out_publish: {type: subflow.flow_output, pos: [640, 160], params: {id: publish}}
  out_path: {type: subflow.flow_output, pos: [960, 160], params: {id: path}}
  out_version: {type: subflow.flow_output, pos: [1280, 160], params: {id: version}}
links:
  - {from: ev.then, to: core.exec}
  - {from: in_session.value, to: core.session}
  - {from: core.then, to: out_publish.exec}
  - {from: core.publish, to: out_publish.value}
  - {from: out_publish.then, to: out_path.exec}
  - {from: core.path, to: out_path.value}
  - {from: out_path.then, to: out_version.exec}
  - {from: core.version, to: out_version.value}
notes:
  - {id: k1, pos: [0, 840], text: "Node livre avec FLUX : lecture seule. Deverrouiller (Team TD) pour ajouter des verifications avant le publish ; Revenir au defaut supprime la copie."}
