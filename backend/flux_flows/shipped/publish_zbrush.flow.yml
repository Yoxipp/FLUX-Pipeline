flux_flow: 2
name: publish_zbrush
label: "Publish ZBrush"
description: "Flow de publish ZBrush (01 section 13) : formulaire du Publisher -> nodes d'equipe optionnels (avant publish) -> zbPublish (boite noire, meme code que le Publisher) -> FlowOutput. Le Publisher n'est pas encore bascule dessus (P8) : on le lance a la main avec Run."
run_policy: queue
interface:
  inputs:
    - {id: "name", type: "str", label: "Nom FLUX du publish", default: ""}
    - {id: "format", type: "str", label: ".ztl, .obj ou .fbx", default: ".ztl"}
    - {id: "description", type: "str", label: "Description du publish (journal)", default: ""}
  outputs:
    - {id: path, type: path, label: "Fichier publie"}
    - {id: version, type: int, label: "Version ecrite"}
nodes:
  ev: {type: event.publish_request, pos: [0, 160], params: {soft: zbrush}}
  inst: {type: session.zb_instance, pos: [320, 160], params: {mode: live_connect_only, pick: active}}
  in_name: {type: data.flow_input, pos: [320, 400], params: {id: name}}
  in_format: {type: data.flow_input, pos: [320, 520], params: {id: format}}
  in_description: {type: data.flow_input, pos: [320, 640], params: {id: description}}
  pub: {type: dcc.zb_publish, pos: [640, 160]}
  out_path: {type: subflow.flow_output, pos: [960, 160], params: {id: path}}
  out_version: {type: subflow.flow_output, pos: [1280, 160], params: {id: version}}
links:
  - {from: ev.then, to: inst.exec}
  - {from: inst.then, to: pub.exec}
  - {from: inst.session, to: pub.session}
  - {from: in_name.value, to: pub.name}
  - {from: in_format.value, to: pub.format}
  - {from: in_description.value, to: pub.description}
  - {from: pub.then, to: out_path.exec}
  - {from: pub.path, to: out_path.value}
  - {from: out_path.then, to: out_version.exec}
  - {from: pub.version, to: out_version.value}
notes:
  - {id: k1, pos: [0, 800], text: "Avant publish : placer les verifications de l'equipe entre l'Instance et zbPublish (flux.refuse_publish arrive en P8).\nApres publish : les flows OnPublish partent tout seuls (log_publish)."}
