flux_flow: 2
name: legacy_publish
label: "publish (v1)"
description: "Publish local : trois etapes, une commande chacune. select  -> choisit la source, calcule le nom FLUX resolve -> trouve le dossier de destination publish -> copie versionnee (vNNN + LAST) + logs dans ce dossier La copie reutilise le chemin resolu (lien de donnees), jamais recalcule. Le contexte (projet, utilisateur) est donne par FLUX au lancement."
run_policy: skip_if_running
origin: {kind: v1, name: publish, shelf: publish}
interface:
  - {id: select_source_path, type: path, label: "Fichier a publier", default: null}
  - {id: publish_description, type: str, label: Description, default: ""}
nodes:
  n1: {type: event.manual, pos: [0, 0], params: {}}
  n2: {type: flux.legacy_command, pos: [320, 0], params: {command: select_publish, ports: {inputs: {source_path: path}, outputs: {filename: str, source_path: path}}}, label: select.select}
  in1: {type: data.flow_input, pos: [320, 124], params: {id: select_source_path}}
  n3: {type: flux.legacy_command, pos: [640, 0], params: {command: build_output_path, ports: {inputs: {filename: str}, outputs: {output_path: path}}}, label: resolve.output}
  n4: {type: flux.legacy_command, pos: [960, 0], params: {command: copy_publish, ports: {inputs: {source_path: path, output_path: path, filename: str, description: str}, outputs: {}}}, label: publish.publish}
  in2: {type: data.flow_input, pos: [960, 164], params: {id: publish_description}}
links:
  - {from: in1.value, to: n2.source_path}
  - {from: in2.value, to: n4.description}
  - {from: n1.then, to: n2.exec}
  - {from: n2.filename, to: n3.filename}
  - {from: n2.filename, to: n4.filename}
  - {from: n2.source_path, to: n4.source_path}
  - {from: n2.then, to: n3.exec}
  - {from: n3.output_path, to: n4.output_path}
  - {from: n3.then, to: n4.exec}
notes:
  - {id: k1, pos: [0, 84], text: "publish.yml — reproduce the current local publish as a declarative action.\n\nThree ordered steps, one command each:\nselect  -> select_publish     : pick source, compute the FLUX filename\nresolve -> build_output_path  : resolve the destination folder\npublish -> copy_publish       : versioned copy + logs into the resolved folder\n\nThe copy step CONSUMES the resolve step's output (output_path) instead of\nrecomputing the path: one resolution, fed forward by reference.\n\nData flows by named reference (value: {from: \"step.command.output_key\"}).\nProduction context (project_path, user, project_name) is injected at run time\nvia the action context snapshot, not through parameters.\n\nsource_path / target_name are set at run time (UI or runner).\ndescription is set at run time (UI or runner)."}
