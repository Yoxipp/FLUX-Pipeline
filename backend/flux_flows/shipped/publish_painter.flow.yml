flux_flow: 2
name: publish_painter
label: "Publish Substance Painter"
description: "Flow de publish Substance Painter (01 section 13) : formulaire du Publisher -> nodes d'equipe optionnels (avant publish) -> spPublish (boite noire, meme code que le Publisher) -> FlowOutput. Le Publisher n'est pas encore bascule dessus (P8) : on le lance a la main avec Run."
run_policy: queue
interface:
  inputs:
    - {id: "class", type: "str", label: "Token CLASS", default: ""}
    - {id: "task", type: "str", label: "Token TYPE (tache)", default: ""}
    - {id: "name", type: "str", label: "Token NAME", default: ""}
    - {id: "instance", type: "str", label: "Token INSTANCE", default: "null"}
    - {id: "preset", type: "str", label: "Preset d'export", default: "PBR Metallic Roughness"}
    - {id: "format", type: "str", label: "Format", default: "png"}
    - {id: "bit_depth", type: "str", label: "Profondeur", default: "8"}
    - {id: "size", type: "int", label: "Largeur (vide = celle du texture set)"}
    - {id: "maps", type: "list[str]", label: "Maps (vide = toutes)"}
    - {id: "conform_tx", type: "bool", label: "Ecrire aussi les .tx", default: false}
    - {id: "description", type: "str", label: "Description du publish (journal)", default: ""}
    - {id: options, type: dict, label: "Options du Publisher (export, knobs...)"}
  outputs:
    - {id: path, type: path, label: "Fichier publie"}
    - {id: version, type: int, label: "Version ecrite"}
    - {id: files, type: "list[path]", label: "Tous les fichiers publies"}
    - {id: warnings, type: "list[str]", label: "Avertissements du publish"}
nodes:
  ev: {type: event.publish_request, pos: [0, 160], params: {soft: painter}}
  inst: {type: session.sp_instance, pos: [320, 160], params: {mode: live_connect_only, pick: active}}
  in_class: {type: data.flow_input, pos: [320, 400], params: {id: class}}
  in_task: {type: data.flow_input, pos: [320, 520], params: {id: task}}
  in_name: {type: data.flow_input, pos: [320, 640], params: {id: name}}
  in_instance: {type: data.flow_input, pos: [320, 760], params: {id: instance}}
  in_preset: {type: data.flow_input, pos: [320, 880], params: {id: preset}}
  in_format: {type: data.flow_input, pos: [320, 1000], params: {id: format}}
  in_bit_depth: {type: data.flow_input, pos: [320, 1120], params: {id: bit_depth}}
  in_size: {type: data.flow_input, pos: [320, 1240], params: {id: size}}
  in_maps: {type: data.flow_input, pos: [320, 1360], params: {id: maps}}
  in_conform_tx: {type: data.flow_input, pos: [320, 1480], params: {id: conform_tx}}
  in_description: {type: data.flow_input, pos: [320, 1600], params: {id: description}}
  pub: {type: dcc.sp_publish, pos: [640, 160]}
  out_path: {type: subflow.flow_output, pos: [960, 160], params: {id: path}}
  out_version: {type: subflow.flow_output, pos: [1280, 160], params: {id: version}}
  in_options: {type: data.flow_input, pos: [320, 1720], params: {id: options}}
  out_files: {type: subflow.flow_output, pos: [1600, 160], params: {id: files}}
  out_warnings: {type: subflow.flow_output, pos: [1920, 160], params: {id: warnings}}
links:
  - {from: ev.then, to: inst.exec}
  - {from: inst.then, to: pub.exec}
  - {from: inst.session, to: pub.session}
  - {from: in_class.value, to: pub.class}
  - {from: in_task.value, to: pub.task}
  - {from: in_name.value, to: pub.name}
  - {from: in_instance.value, to: pub.instance}
  - {from: in_preset.value, to: pub.preset}
  - {from: in_format.value, to: pub.format}
  - {from: in_bit_depth.value, to: pub.bit_depth}
  - {from: in_size.value, to: pub.size}
  - {from: in_maps.value, to: pub.maps}
  - {from: in_conform_tx.value, to: pub.conform_tx}
  - {from: in_description.value, to: pub.description}
  - {from: pub.then, to: out_path.exec}
  - {from: pub.path, to: out_path.value}
  - {from: out_path.then, to: out_version.exec}
  - {from: pub.version, to: out_version.value}
  - {from: in_options.value, to: pub.options}
  - {from: out_version.then, to: out_files.exec}
  - {from: pub.files, to: out_files.value}
  - {from: out_files.then, to: out_warnings.exec}
  - {from: pub.warnings, to: out_warnings.value}
notes:
  - {id: k1, pos: [0, 1760], text: "Avant publish : placer les verifications de l'equipe entre l'Instance et spPublish (flux.refuse_publish arrive en P8).\nApres publish : les flows OnPublish partent tout seuls (log_publish)."}
